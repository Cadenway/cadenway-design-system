name: Bug report
description: Something in cadenway-design-system does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **A security problem must not be reported here**: follow
        .github/SECURITY.md instead. Never paste a token, a password or personal data.

  - type: input
    id: task
    attributes:
      label: Cadenway task
      description: The task id, if one already tracks this bug.
      placeholder: CAD-482

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The expected behavior, ideally with a link to the matching mockup screen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Storybook story of the component
        2. Set the input or use the keyboard as follows
        3. ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@cadenway/tokens'
        - '@cadenway/icons'
        - '@cadenway/ui'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version you installed.
      placeholder: v1.4.2

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140, Windows 11

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: This report contains no secret, token or personal data.
          required: true
