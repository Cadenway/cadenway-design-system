<ng-content>
  <span class="flex items-center gap-1.5">
    <kbd cwKbd>↑</kbd><kbd cwKbd>↓</kbd>{{ navigateLabel() }}
  </span>
  <span class="flex items-center gap-1.5"
    ><kbd cwKbd>{{ keyLabels.enterKey }}</kbd
    >{{ runLabel() }}</span
  >
  @if (closeLabel()) {
    <span class="ml-auto flex items-center gap-1.5"
      ><kbd cwKbd>{{ keyLabels.escapeKey }}</kbd
      >{{ closeLabel() }}</span
    >
  }
</ng-content>
