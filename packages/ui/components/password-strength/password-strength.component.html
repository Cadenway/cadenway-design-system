<cw-meter
  variant="segmented"
  size="sm"
  [segments]="total()"
  [max]="total()"
  [value]="notches()"
  [zone]="zone()"
  [format]="format"
  [ariaLabel]="labels.meter"
/>
<ul class="grid grid-cols-1 gap-1 sm:grid-cols-2" [id]="rulesId">
  @for (result of results(); track result.rule.id) {
    @let classes = result.met ? ruleClasses.met : ruleClasses.unmet;
    <li [class]="classes.item">
      <svg class="size-3.5 shrink-0 overflow-visible" viewBox="0 0 16 16" aria-hidden="true">
        <svg:circle
          [class]="classes.ring"
          cx="8"
          cy="8"
          r="6.25"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          pathLength="24"
        />
        <svg:circle [class]="classes.fill" cx="8" cy="8" r="7" fill="currentColor" />
        <svg:path
          [class]="classes.check"
          d="M5.2 8.3l1.9 1.9 3.8-4"
          fill="none"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          pathLength="1"
        />
      </svg>
      <span>{{ result.rule.label }}</span>
      <span class="sr-only">{{ result.met ? labels.met : labels.unmet }}</span>
    </li>
  }
</ul>
