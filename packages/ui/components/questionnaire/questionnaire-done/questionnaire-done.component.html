<div class="flex items-start gap-3">
  <span
    class="flex size-8 shrink-0 items-center justify-center rounded-full bg-jade-soft text-jade"
    aria-hidden="true"
  >
    <ng-icon name="phosphorCheckBold" size="1rem" />
  </span>
  <div class="grid min-w-0 gap-0.5">
    <div class="text-sm leading-5 font-semibold">{{ title() }}</div>
    <p class="text-xs leading-4 text-muted-foreground empty:hidden"><ng-content /></p>
  </div>
</div>
@if (summary().length > 0) {
  <dl
    class="mt-3 grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-1 border-t pt-3 text-xs leading-4"
  >
    @for (item of summary(); track $index) {
      <dt class="text-muted-foreground">{{ item.label }}</dt>
      <dd class="truncate">{{ item.value }}</dd>
    }
  </dl>
}
<div class="mt-3 empty:hidden"><ng-content select="button, a" /></div>
