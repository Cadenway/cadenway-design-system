<ng-content />
@if (count() !== undefined) {
  @if (countLabel(); as label) {
    <span class="sr-only">, {{ label }}</span
    ><span aria-hidden="true" [class]="countClasses()">{{ count() }}</span>
  } @else {
    <span class="sr-only">, </span><span [class]="countClasses()">{{ count() }}</span>
  }
}
