<div
  class="flex min-h-11 flex-wrap items-center justify-between gap-x-4 gap-y-2 border-t px-3 py-1.5 text-sm text-muted-foreground"
>
  <span class="tabular-nums" aria-live="polite">{{
    table.copy().range(table.rangeFirst(), table.rangeLast(), table.totalCount())
  }}</span>
  <cw-pagination
    variant="simple"
    size="sm"
    [showFirstLast]="false"
    [total]="table.totalCount()"
    [page]="current()"
    [pageSize]="table.pageSize()"
    [pageSizes]="table.pageSizes()"
    [ariaLabel]="table.copy().pagination"
    (pageChange)="table.setPage($event)"
    (pageSizeChange)="table.setPageSize($event)"
  />
</div>
