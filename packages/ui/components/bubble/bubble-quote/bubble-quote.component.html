<blockquote
  [attr.cite]="cite() || null"
  class="relative grid gap-0.5 rounded-md bg-background/70 px-2 py-1.5 text-xs leading-4 has-focus-visible:ring-2 has-focus-visible:ring-ring has-focus-visible:ring-offset-2 has-focus-visible:ring-offset-background"
>
  <button
    type="button"
    class="flex w-fit items-center gap-1 text-left font-medium text-foreground outline-none after:absolute after:inset-0 after:content-['']"
    (click)="navigate.emit()"
  >
    <ng-icon
      name="phosphorArrowBendUpLeftBold"
      size="0.75rem"
      class="shrink-0 text-muted-foreground"
      aria-hidden="true"
    />{{ author() }}
  </button>
  <span class="line-clamp-2 text-muted-foreground"><ng-content /></span>
</blockquote>
