<svg
  viewBox="0 0 24 24"
  class="shrink-0"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.role]="decorative() || lockup() ? null : 'img'"
  [attr.aria-label]="decorative() || lockup() ? null : 'Cadenway'"
  [attr.aria-hidden]="decorative() || lockup() ? 'true' : null"
  focusable="false"
>
  <svg:path
    [attr.d]="drawing().path"
    fill="none"
    stroke="currentColor"
    [attr.stroke-width]="drawing().strokeWidth"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <svg:circle
    cx="12"
    [attr.cy]="drawing().dotY"
    [attr.r]="drawing().dotRadius"
    fill="currentColor"
  />
</svg>
@if (lockup()) {
  <span
    class="font-bold leading-none tracking-[-0.035em] whitespace-nowrap text-foreground"
    [style.font-size.px]="wordmarkSize()"
    aria-hidden="true"
    >Cadenway</span
  >
}
