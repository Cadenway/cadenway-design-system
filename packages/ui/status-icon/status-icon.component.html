@if (milestone()) {
  <svg
    viewBox="0 0 16 16"
    aria-hidden="true"
    focusable="false"
    class="cw-status cw-ms block size-full"
    [class]="tone()"
  >
    <defs>
      <clipPath [attr.id]="clipId">
        <rect x="5.15" y="5.15" width="5.7" height="5.7" rx="1" transform="rotate(45 8 8)" />
      </clipPath>
    </defs>
    <g transform="rotate(45 8 8)">
      <rect
        class="cw-status-ring"
        x="2.9"
        y="2.9"
        width="10.2"
        height="10.2"
        rx="2.4"
        pathLength="39.27"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
    <g [attr.clip-path]="clipUrl">
      <circle
        class="cw-status-pie"
        cx="8"
        cy="8"
        r="2.5"
        pathLength="11"
        fill="none"
        stroke="currentColor"
        stroke-width="5"
        transform="rotate(-90 8 8)"
      />
    </g>
    <g transform="rotate(45 8 8)">
      <rect
        class="cw-status-disc"
        x="2.65"
        y="2.65"
        width="10.7"
        height="10.7"
        rx="2.5"
        fill="currentColor"
      />
    </g>
    <g transform="translate(8 8) scale(0.816) translate(-8 -8)">
      <path
        class="cw-status-wait"
        d="M8 4.6V8l2.3 1.5"
        pathLength="1"
        fill="none"
        stroke="currentColor"
        stroke-width="1.84"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="cw-status-in"
        d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4"
        pathLength="1"
        fill="none"
        stroke="currentColor"
        stroke-width="1.84"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="cw-status-check"
        d="M5.5 8.5 7 10l3.5-3.5"
        fill="none"
        stroke-width="1.84"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="cw-status-x"
        d="M5.75 5.75 10.25 10.25"
        fill="none"
        stroke-width="1.84"
        stroke-linecap="round"
      />
      <path
        class="cw-status-x"
        d="M10.25 5.75 5.75 10.25"
        fill="none"
        stroke-width="1.84"
        stroke-linecap="round"
      />
      <path
        class="cw-status-bar"
        d="M4.46 4.46 11.54 11.54"
        fill="none"
        stroke="currentColor"
        stroke-width="1.84"
        stroke-linecap="round"
      />
    </g>
  </svg>
} @else {
  <svg
    viewBox="0 0 16 16"
    aria-hidden="true"
    focusable="false"
    class="cw-status block size-full"
    [class]="tone()"
  >
    <circle
      class="cw-status-ring"
      cx="8"
      cy="8"
      r="6.25"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <circle
      class="cw-status-pie"
      cx="8"
      cy="8"
      r="1.75"
      fill="none"
      stroke="currentColor"
      stroke-width="3.5"
      transform="rotate(-90 8 8)"
    />
    <path
      class="cw-status-wait"
      d="M8 4.6V8l2.3 1.5"
      pathLength="1"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      class="cw-status-in"
      d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4"
      pathLength="1"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle class="cw-status-disc" cx="8" cy="8" r="6.5" fill="currentColor" />
    <path
      class="cw-status-check"
      d="M5.5 8.5 7 10l3.5-3.5"
      fill="none"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      class="cw-status-x"
      d="M5.75 5.75 10.25 10.25"
      fill="none"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <path
      class="cw-status-x"
      d="M10.25 5.75 5.75 10.25"
      fill="none"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <path
      class="cw-status-bar"
      d="M4.46 4.46 11.54 11.54"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </svg>
}
